name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @teek/helper 与部分插件以 ./dist 为入口，dist 不入库，
      # 全新检出必须先 stub 出构建产物，否则 VitePress 构建会报 Failed to resolve entry
      - name: Stub workspace packages
        run: pnpm stub

      # 用户站点（仓库名以 .github.io 结尾）部署在根路径，项目站点在 /仓库名/ 下
      - name: Resolve site path
        id: site
        run: |
          repo="${{ github.event.repository.name }}"
          owner="${{ github.repository_owner }}"
          if [[ "$repo" == *.github.io ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "url=https://${repo}" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${repo}/" >> "$GITHUB_OUTPUT"
            echo "url=https://${owner}.github.io/${repo}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build docs
        run: pnpm -C docs build
        env:
          DOCS_BASE: ${{ steps.site.outputs.base }}
          DOCS_SITE_URL: ${{ steps.site.outputs.url }}

      # GitHub Pages 不做扩展名省略：/about 不会自动映射到 about.html，
      # 因此为每个页面生成 x/index.html，保证 cleanUrls 形式的地址可访问
      - name: Create clean-URL fallbacks
        run: |
          cd docs/.vitepress/dist
          find . -name '*.html' ! -name 'index.html' -print0 | while IFS= read -r -d '' file; do
            target="${file%.html}"
            mkdir -p "$target"
            cp "$file" "$target/index.html"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
